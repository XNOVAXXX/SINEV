# Servidor de SINEV. "no-cache" obliga al navegador a preguntar si hay una versión nueva antes de
# usar su copia guardada (si no cambió, responde 304 sin volver a descargar), así nunca queda código viejo.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        # Cabeceras de seguridad (van aquí porque nginx no hereda las del bloque server si la location define alguna)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Solo se cargan scripts propios y de jsDelivr (Lucide y supabase-js); la API solo puede ir a Supabase
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ =404;
    }
}
